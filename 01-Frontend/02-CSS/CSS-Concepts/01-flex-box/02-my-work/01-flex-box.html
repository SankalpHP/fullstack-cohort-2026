<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>flex-box</title>
    <style>
        body{
            display: flex;
            justify-content: center;
            align-items: center;
            height: 400px;
            border: 1px solid red;
        }
        .card-section{
            display: flex;
            border:1px solid red;
            height: 300px;
            width: 1000px;
            padding: 20px;
            justify-content: space-evenly;
            align-items: center;

            .card{
                width: 100px;
                height: 100px;
                border: 1px solid red;
            }
        }
    </style>
</head>
<body>
    <div class="card-section">
        <div class="card">
                1
        </div>
        <div class="card">
                2
        </div>
        <div class="card">
                3
        </div>
        <div class="card">
                4
        </div>
        <div class="card">
                5
        </div>
    </div>
</body>
</html>
